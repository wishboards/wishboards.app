AWSTemplateFormatVersion: "2010-09-09"
Description: True least-privilege GitHub OIDC deployment role for wishboards.app (S3 + CloudFront + Route 53 only)

Parameters:
  GitHubOrg:
    Type: String
    Default: wishboards
    Description: GitHub Organization or Username.
  GitHubRepo:
    Type: String
    Default: wishboards.app
    Description: GitHub Repository Name.
  OidcProviderArn:
    Type: String
    Default: ""
    Description: (Optional) Existing OIDC Provider ARN. If empty, the existing account provider will be used or created.

Conditions:
  CreateOIDCProvider: !Equals [!Ref OidcProviderArn, ""]

Resources:
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GithubDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${GitHubRepo}-deployer-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                !If [
                  CreateOIDCProvider,
                  !Ref GithubOidcProvider,
                  !Ref OidcProviderArn,
                ]
            Action:
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"

      Policies:
        - PolicyName: WishboardsAppDeployerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 1. CloudFormation Stack Management (Strictly scoped to wishboards-app-landing)
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:UpdateStack
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStackResource
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/wishboards-app-landing*/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"

              # 2. S3 Bucket Management (Website bucket + SAM artifacts bucket only)
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                Resource:
                  - "arn:aws:s3:::wishboards-app-*"
                  - "arn:aws:s3:::aws-sam-cli-managed-default-*"

              # 3. CloudFront Distribution, OAC & Functions
              - Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:CreateFunction
                  - cloudfront:UpdateFunction
                  - cloudfront:PublishFunction
                  - cloudfront:DescribeFunction
                  - cloudfront:GetFunction
                  - cloudfront:DeleteFunction
                Resource: "*"

              # 4. Route 53 DNS RecordSets for wishboards.app
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:GetChange
                Resource:
                  - !Sub "arn:aws:route53:::hostedzone/*"
                  - !Sub "arn:aws:route53:::change/*"

              # 5. STS
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"

Outputs:
  RoleArn:
    Value: !GetAtt GithubDeployerRole.Arn
    Description: ARN of the GitHub Actions deployment role for wishboards.app.
