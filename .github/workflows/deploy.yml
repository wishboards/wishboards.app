name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Type-Check
        run: |
          npm run lint
          npm run build

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials (OIDC)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy AWS SAM Stack
        if: env.AWS_ROLE_ARN != ''
        run: |
          sam build
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name wishboards-app-landing \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DomainName="wishboards.app" \
              WwwDomainName="www.wishboards.app" \
              HostedZoneId="${{ secrets.HOSTED_ZONE_ID }}" \
              AcmCertificateArn="${{ secrets.ACM_CERTIFICATE_ARN }}"

      - name: Sync Static Assets to S3
        if: env.AWS_ROLE_ARN != ''
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name wishboards-app-landing --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name wishboards-app-landing --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          aws s3 sync dist/ s3://$BUCKET/ --delete --cache-control "public, max-age=31536000, immutable" --exclude "index.html"
          aws s3 cp dist/index.html s3://$BUCKET/index.html --cache-control "public, max-age=0, must-revalidate"
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
