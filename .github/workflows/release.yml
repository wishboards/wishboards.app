name: Release & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.release.outputs['paths_._tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Lint & Build Frontend
        run: |
          npm run lint
          npm run build

      - name: Setup AWS SAM CLI
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true

      - name: Configure AWS Credentials (OIDC)
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy AWS SAM Stack
        if: env.AWS_ROLE_TO_ASSUME != ''
        run: |
          sam build
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name wishboards-app-landing \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              DomainName="wishboards.app" \
              WwwDomainName="www.wishboards.app" \
              HostedZoneId="${{ vars.HOSTED_ZONE_ID || secrets.HOSTED_ZONE_ID }}" \
              AcmCertificateArn="${{ vars.ACM_CERTIFICATE_ARN || secrets.ACM_CERTIFICATE_ARN }}"

      - name: Sync Static Assets to S3 & Invalidate CloudFront
        if: env.AWS_ROLE_TO_ASSUME != ''
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name wishboards-app-landing --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name wishboards-app-landing --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          aws s3 sync dist/ s3://$BUCKET/ --delete --cache-control "public, max-age=31536000, immutable" --exclude "index.html"
          aws s3 cp dist/index.html s3://$BUCKET/index.html --cache-control "public, max-age=0, must-revalidate"
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
